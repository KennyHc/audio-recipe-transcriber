# The hosted web app: a static-assets-only Worker (Cloudflare Pages is now part of
# Workers). No server code and no secrets here — the API lives in worker/.
# Deploy with `npm run deploy:site` from the repo root (builds with the no-secrets check).
name = "recipe-transcriber"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
