name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: No API keys in tracked files
        run: |
          if git grep -nE 'sk-ant-[a-z]+[0-9]+-[A-Za-z0-9_-]{60,}'; then
            echo "::error::Something that looks like a real Anthropic API key is committed."
            exit 1
          fi

      - run: npm ci

      - name: Typecheck (server, web, worker)
        run: npm run typecheck

      - name: Tests (server, web, worker)
        run: npm test

      - name: Build web (local-server mode)
        run: npm run build -w web

      - name: Build web (bring-your-own-key mode)
        run: npm run build:browser -w web

      # Fails if the hosted bundle contains a key or references api.anthropic.com.
      - name: Build web (hosted mode) + secret scan
        run: npm run build:hosted -w web
        env:
          VITE_API_BASE: https://example.invalid
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA # Cloudflare's public test key

      - name: Bundle the Worker (no deploy)
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir ../.wrangler-dry-run
